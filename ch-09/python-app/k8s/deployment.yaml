apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  labels:
    app: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      # Reference the secret we will create to pull the private image
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: python-app
          image: <YOUR_IMAGE_TAG> # Replaced dynamically in the pipeline
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
