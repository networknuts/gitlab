stages:
  - build
  - merge

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/nginx
  DOCKER_TLS_CERTDIR: "/certs"

# 1. Build each architecture natively in parallel
build_arch:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - ARCH: amd64
        PLATFORM: linux/amd64
        RUNNER_TAG: saas-linux-small-amd64
      - ARCH: arm64
        PLATFORM: linux/arm64
        RUNNER_TAG: saas-linux-medium-arm64
  tags:
    - $RUNNER_TAG
  before_script:
    # using already created deploy access tokens in the project added as variables
    - docker login -u $CI_DEPLOY_USER -p $CI_DEPLOY_PASSWORD $CI_REGISTRY
    # - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Create a dedicated Docker context and attach a Buildx builder to it
    - docker context create "ctx-${ARCH}"
    - docker buildx create --name "builder-${ARCH}" --driver docker-container --use "ctx-${ARCH}"
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --platform "$PLATFORM" \
        --tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}-${ARCH}" \
        --cache-from type=registry,ref="${IMAGE_NAME}:cache-${ARCH}" \
        --cache-to type=registry,ref="${IMAGE_NAME}:cache-${ARCH}",mode=max \
        --push \
        .

# 2. Combine architecture-specific tags into a single multi-arch manifest
create_manifest:
  stage: merge
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - build_arch
  before_script:
    # using already created deploy access tokens in the project added as variables
    - docker login -u $CI_DEPLOY_USER -p $CI_DEPLOY_PASSWORD $CI_REGISTRY
    # - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker buildx imagetools create \
        --tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        --tag "${IMAGE_NAME}:latest" \
        "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}-amd64" \
        "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}-arm64"
    # Verify the merged manifest contains both architectures
    - docker buildx imagetools inspect "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

