apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      imagePullSecrets:
      - name: imagecreds
      containers:
      - name: boxone
        image: registry.gitlab.com/networknuts/kubernetes-data/cardio:v1
        ports:
        - containerPort: 80